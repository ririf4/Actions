name: Receive and Notify Discord

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Base64-encoded JSON payload
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Decode and validate payload
        env:
          ENCODED_PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail

          printf '%s' "$ENCODED_PAYLOAD" | base64 --decode > payload.json

          jq empty payload.json

      - name: Run Discord Dispatcher
        env:
          DISCORD_COMMIT_WEBHOOK: ${{ secrets.DISCORD_COMMIT_WEBHOOK }}
          DISCORD_ISSUE_WEBHOOK: ${{ secrets.DISCORD_ISSUE_WEBHOOK }}
          DISCORD_PR_WEBHOOK: ${{ secrets.DISCORD_PR_WEBHOOK }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          set -euo pipefail
          ./gradlew run --args="payload.json"
